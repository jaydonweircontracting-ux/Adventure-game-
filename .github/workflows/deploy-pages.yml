name: Deploy Adventure Game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    outputs:
      expected_build: ${{ steps.version.outputs.build }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Read expected build marker
        id: version
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const source = fs.readFileSync('scripts/prepare-build-entry.cjs', 'utf8');
          const match = source.match(/__AG_BUILD.{0,8}?(\d{3,})/);
          if (!match) throw new Error('Unable to read expected build marker');
          console.log(`build=${match[1]}`);
          NODE
      - name: Type check
        run: npm run typecheck
      - name: Isometric direction regression test
        run: npm run test:iso-directions
      - name: Live update version regression test
        run: npm run test:update-version
      - name: Build site
        run: npm run build
      - name: Configure Pages artifact
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed build markers
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_BUILD: ${{ needs.build.outputs.expected_build }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            cache_bust="$(date +%s)"
            if curl -fsSL "${PAGE_URL%/}/version.json?verify=${cache_bust}" -o /tmp/live-version.json &&
               curl -fsSL "${PAGE_URL%/}/?verify=${cache_bust}" -o /tmp/live-index.html; then
              actual="$(node -e "const fs=require('node:fs'); console.log(JSON.parse(fs.readFileSync('/tmp/live-version.json','utf8')).build ?? '')")"
              html_build="$(node -e "const fs=require('node:fs'); const s=fs.readFileSync('/tmp/live-index.html','utf8'); const m=s.match(/__AG_BUILD.{0,8}?(\d{3,})/); console.log(m ? m[1] : '')")"
              if [ "${actual}" = "${EXPECTED_BUILD}" ] && [ "${html_build}" = "${EXPECTED_BUILD}" ]; then
                echo "Verified deployed BUILD ${actual} (manifest and HTML marker) at ${PAGE_URL}"
                exit 0
              fi
              echo "Waiting for Pages: expected ${EXPECTED_BUILD}; manifest=${actual}; html=${html_build}"
            else
              echo "Published artifact is not reachable yet"
            fi
            sleep 10
          done
          echo "::error::Published manifest/HTML marker never matched BUILD ${EXPECTED_BUILD}"
          exit 1
