name: Deploy Adventure Game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Do not cancel a deployment just because the follow-up build-marker commit lands.
  # Each queued run must finish so the deployed manifest cannot stay behind main.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Isometric direction regression test
        run: npm run test:iso-directions
      - name: Settlement economy regression test
        run: npm run test:settlement-economy
      - name: Little World Generator regression test
        run: npm run test:little-world-generator
      - name: Expanded world map coherence regression test
        run: npm run test:world-map-coherence
      - name: Exhaustive landscape chunk-edge continuity regression test
        run: npm run test:landscape-coherence
      - name: Isometric tile asset integrity regression test
        run: npm run test:iso-tile-assets
      - name: Building sprite and pinned town footprint regression test
        run: npm run test:building-art
      - name: Guard pursuit and NPC combat regression test
        run: npm run test:npc-combat
      - name: Selective body-loot regression test
        run: npm run test:body-loot
      - name: Character-creator equipment restriction regression test
        run: npm run test:character-creator
      - name: Stage player idle and walk animations for the 3D renderer
        run: |
          mkdir -p public/game-sprites/baseHumanMale
          for cam in 0 1 2 3 4 5 6 7; do
            cp "game sprites/baseHumanMale/1_Idle_CAM${cam}_25.png" "public/game-sprites/baseHumanMale/idle-${cam}.png"
            cp "game sprites/baseHumanMale/5_Walk_CAM${cam}_190.png" "public/game-sprites/baseHumanMale/walk-${cam}.png"
          done
      - name: Stage real low-poly FBX houses for the 3D runtime
        run: |
          mkdir -p public/3d-houses
          cp House_01_full.fbx House_02_full.fbx House_03_full.fbx House_04_full.fbx public/3d-houses/
          cp house_05_full.fbx house_06_full.fbx house_07_full.fbx house_08_full.fbx public/3d-houses/
      - name: Build site
        run: npm run build
      - name: Verify update notifier build-number consistency
        run: npm run test:update-version
      - name: Configure Pages artifact
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
