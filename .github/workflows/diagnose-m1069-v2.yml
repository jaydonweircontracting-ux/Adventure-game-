name: Compare M1069 river and bridge baselines

on:
  push:
    branches:
      - "diagnose/m1069-v2-baseline"

permissions:
  contents: read

jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: river-v2
            sha: ca5b9ced5104970762ec32005edc7b2f0ee379dc
          - label: voxel-and-bridge-detection
            sha: e522f71f5c2f5b6fdbd4c5e7c6b6f1e4c4b9c8a0
          - label: half-block-elevation
            sha: 03e46d7376f41f4c2ef702c155ca8b8d45716066
          - label: bridge-ranking
            sha: d262f66b17053dd53711d1f262ef1adece5334d4
          - label: bridge-spans
            sha: c30f1f063103ec2db2c51a910c6238f8ae30d574
          - label: bank-approaches
            sha: 4fe822af6a87fa9b47ea545c84b4ca35e1f88518
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout ${{ matrix.label }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
      - name: Confirm source revision
        run: git rev-parse HEAD
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Stop the historical harness after M1069
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'scripts/simulate.ts';
          let source = fs.readFileSync(file, 'utf8');
          const marker = "console.log('M1069 24h:";
          const at = source.indexOf(marker);
          if (at < 0) throw new Error('M1069 output marker not found');
          const close = source.indexOf(');', at);
          if (close < 0) throw new Error('M1069 output statement did not close');
          source = source.slice(0, close + 2) + '\nprocess.exit(0);\n' + source.slice(close + 2);
          fs.writeFileSync(file, source);
          NODE
          npx tsx scripts/simulate.ts
