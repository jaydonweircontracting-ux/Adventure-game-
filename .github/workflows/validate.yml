name: Validate Adventure Game

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Isometric direction regression test
        run: npm run test:iso-directions
      - name: Production build
        # The CI smoke server hosts dist/public at /, not /Adventure-game-/.
        # Use root-relative assets here; the Pages deployment workflow keeps its repository base path.
        run: BASE_PATH=/ npm run build
      - name: Live update version regression test
        run: npm run test:update-version
      - name: Fantasy encounter regression test
        run: npm run test:fantasy-encounters
      - name: Landscape coherence regression test
        run: npm run test:landscape-coherence
      - name: Procedural world art regression test
        run: npm run test:procedural-world-art
      - name: Building art regression test
        run: npm run test:building-art
      - name: Town production regression test
        run: npm run test:town-production
      - name: Village food-needs regression test
        run: npm run test:village-food-needs
      - name: World development foundation regression test
        run: npm run test:world-dev-foundation
      - name: Settlement economy regression test
        run: npm run test:settlement-economy
      - name: Caravan trade regression test
        run: npm run test:caravan-trade
      - name: Quest playthrough regression test
        run: npx tsx tests/quest-playthrough.mts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start built game server
        run: |
          python3 -m http.server 8901 --directory dist/public > /tmp/adventure-game-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8901/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/adventure-game-server.log
          exit 1
      - name: Real-game browser smoke test
        run: node tests/real-game/smoke.mjs
      - name: Real-game movement and doorway test
        run: node tests/real-game/movement.mjs
