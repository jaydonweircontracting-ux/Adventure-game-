name: Validate Adventure Game

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

# The suites are independent and read-only. Run the three bounded lanes in
# parallel so a slow simulation cannot hold up the typecheck or browser probe.
# The game itself is still changed by one code worker per isolated worktree.
jobs:
  foundation:
    name: Foundation and static regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: NEURON HEX scheduler and release-plan regression test
        run: node studio/neuron-hex/scheduler.test.mjs
      - name: NEURON HEX execution metrics regression test
        run: node studio/neuron-hex/execution.test.mjs
      - name: NEURON HEX event-ledger regression test
        run: node studio/neuron-hex/events.test.mjs
      - name: Type check
        run: npm run typecheck
      - name: Animation runtime regression test
        run: npm run test:animation-runtime
      - name: PBR material runtime regression test
        run: npm run test:material-runtime
      - name: Custom model UV and material preservation regression test
        run: npm run test:custom-asset-materials
      - name: glTF skeletal animation baking regression test
        run: npm run test:gltf-skeletal-animation
      - name: Isometric direction regression test
        run: npm run test:iso-directions
      - name: Isometric tile asset integrity regression test
        run: npm run test:iso-tile-assets
      - name: Fantasy encounter regression test
        run: npm run test:fantasy-encounters
      - name: NPC retaliation and guard pursuit regression test
        run: npm run test:npc-combat
      - name: Landscape coherence regression test
        run: npm run test:landscape-coherence
      - name: Expanded world map coherence regression test
        run: npm run test:world-map-coherence
      - name: Procedural world art regression test
        run: npm run test:procedural-world-art
      - name: Building art regression test
        run: npm run test:building-art
      - name: Selective body-loot regression test
        run: npm run test:body-loot
      - name: Character-creator equipment restriction regression test
        run: npm run test:character-creator

  simulation:
    name: Economy and world simulation regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Town production regression test
        run: npm run test:town-production
      - name: Village food-needs regression test
        run: npm run test:village-food-needs
      - name: World development foundation regression test
        run: npm run test:world-dev-foundation
      - name: Settlement economy regression test
        run: npm run test:settlement-economy
      - name: River bridge ranking regression test
        run: npm run test:river-bridge-ranking
      - name: Unified living-world simulation regression test
        run: npm run test:world-simulation
      - name: Little World Generator regression test
        run: npm run test:little-world-generator
      - name: Caravan trade regression test
        run: npm run test:caravan-trade
      - name: Quest playthrough regression test
        run: npx tsx tests/quest-playthrough.mts

  browser:
    name: Production build and real-game browser probes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        # The CI smoke server hosts dist/public at /, not /Adventure-game-/.
        # Use root-relative assets here; the Pages deployment workflow keeps its repository base path.
        run: BASE_PATH=/ npm run build
      - name: Live update version regression test
        run: npm run test:update-version
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start built game server
        run: |
          python3 -m http.server 8901 --directory dist/public > /tmp/adventure-game-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8901/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/adventure-game-server.log
          exit 1
      - name: Real-game browser smoke test
        run: node tests/real-game/smoke.mjs
      - name: Real-game movement and doorway test
        run: node tests/real-game/movement.mjs
      - name: Phone-size generated bridge traversal probe
        run: node tests/real-game/bridge-crossing.mjs
      - name: First-person and orbit camera control regression test
        run: node tests/real-game/camera-controls.mjs
      - name: Upload camera-control screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-controls-${{ github.sha }}
          path: tests/real-game/camera-controls-screenshot.png
          if-no-files-found: warn

  performance:
    name: World performance baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Benchmark production world systems
        run: npm run benchmark:world
      - name: Preserve benchmark measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-performance-${{ github.sha }}
          path: work/experiments/benchmark-world.json
          if-no-files-found: warn
