name: Diagnose week-after-reload food production

on:
  push:
    branches:
      - "diagnose/**"

permissions:
  contents: read

concurrency:
  group: diagnose-reload-week-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run the full settlement simulation harness
        shell: bash
        run: |
          # Keep the M1088 fixture on its original passing setup. createSettlementSim
          # already stamps the rivers, seeds the farm/well, and mirrors the live world.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'scripts/simulate.ts';
          let source = fs.readFileSync(path, 'utf8');
          const replacements = [
            [
              "const wBridge1088 = W.defaultWorld();\n  RV1088.stampRivers(wBridge1088); // mirror worldSync3d.syncWorldOnLoad before bridge detection",
              "const wBridge1088 = SS.createSettlementSim(W.defaultWorld()).world;"
            ],
            [
              "  RV1088.stampRivers(simWeek1088.world); // the live world sync stamps the persistent river map before simulation\n",
              ""
            ]
          ];
          for (const [before, after] of replacements) {
            if (!source.includes(before)) throw new Error('diagnostic fixture patch did not find expected source block');
            source = source.replace(before, after);
          }
          fs.writeFileSync(path, source);
          NODE
          set +e
          npx tsx scripts/simulate.ts > /tmp/diag-reload-week.log 2>&1
          result=$?
          echo "SIMULATE_EXIT_CODE=$result"
          echo "----- RELOAD SNAPSHOTS -----"
          grep "M1105 RELOAD SNAP" /tmp/diag-reload-week.log || true
          echo "----- FINAL SIMULATION OUTPUT -----"
          tail -n 100 /tmp/diag-reload-week.log
          exit "$result"
      - name: Preserve full diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-reload-week
          path: /tmp/diag-reload-week.log
          if-no-files-found: warn
