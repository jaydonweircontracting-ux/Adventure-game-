name: Diagnose week-after-reload food production

on:
  push:
    branches:
      - "diagnose/**"

permissions:
  contents: read

concurrency:
  group: diagnose-reload-week-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run the full settlement simulation harness
        shell: bash
        run: |
          # RV1088 was originally declared inside the BUILD 1086 test block,
          # but BUILD 1088 and the week fixture are separate lexical blocks.
          # Add a module-scope import for this diagnostic run; the nested local
          # import remains scoped to its original block.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'scripts/simulate.ts';
          const marker = "import * as RV1088 from '../src/game/engine3d/rivers.js';\\n";
          const source = fs.readFileSync(path, 'utf8');
          if (!source.includes(marker)) fs.writeFileSync(path, marker + source);
          NODE
          set +e
          npx tsx scripts/simulate.ts > /tmp/diag-reload-week.log 2>&1
          result=$?
          echo "SIMULATE_EXIT_CODE=$result"
          echo "----- RELOAD SNAPSHOTS -----"
          grep "M1105 RELOAD SNAP" /tmp/diag-reload-week.log || true
          echo "----- FINAL SIMULATION OUTPUT -----"
          tail -n 100 /tmp/diag-reload-week.log
          exit "$result"
      - name: Preserve full diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-reload-week
          path: /tmp/diag-reload-week.log
          if-no-files-found: warn
